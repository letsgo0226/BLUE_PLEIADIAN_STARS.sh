services:
  riemann-log-product:
    build:
      context: ../..
      dockerfile: deployment/riemann_log_product/Dockerfile
    restart: unless-stopped
    environment:
      ROOT: /app
      DATA_DIR: /data
      INTERVAL: "1"
    volumes:
      - ./runtime:/data
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py", "/data/state.json"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
